<page-container>
  <page-header>
    <div pageHeaderTitle>Pacientes</div>
    <div pageHeaderActions>
      <button matButton="filled" routerLink="create">
        <div class="icon-with-text">
          <span class="material-symbols-outlined">person_add</span>
          Nuevo Paciente
        </div>
      </button>
    </div>
  </page-header>

  <page-content>
    <div class="flex flex-col space-y-4">
      <mat-form-field appearance="outline" class="form-field-compact w-full bg-on-primary" subscriptSizing="dynamic">
        <mat-label>Buscar por nombre o apellido...</mat-label>
        <span class="material-symbols-outlined" matIconPrefix>search</span>
        <input matInput>
      </mat-form-field>

      <section class="flex justify-end items-center gap-3 flex-wrap bg-surface border border-surface-container-highest rounded-xl py-3 px-4 mb-4">
        <span class="material-symbols-outlined">filter_alt</span>
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="form-field-compact">
          <mat-label>Consultorio</mat-label>
          <mat-select>
            <mat-option>Consultorio 1</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline" class="form-field-compact" subscriptSizing="dynamic">
          <mat-label>Sexo Registrado</mat-label>
          <mat-select>
            <mat-option>Masculino</mat-option>
            <mat-option>Femenino</mat-option>
          </mat-select>
        </mat-form-field>
        <div class="flex-1"></div>
        <button matButton>Limpiar Filtros</button>
      </section>

      <section class="bg-surface rounded-xl border border-surface-container-highest">
        <div class="flex flex-row justify-between items-center bg-surface-container-high rounded-t-xl px-4">
          <div class="font-(--font-weight-title)">
            <span>124 pacientes</span>
          </div>
        </div>

        <table mat-table [dataSource]="data">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Nombre </th>
            <td mat-cell *matCellDef="let element"> {{element.name }}</td>
          </ng-container>

          <ng-container matColumnDef="birthDate">
            <th mat-header-cell *matHeaderCellDef> Edad </th>
            <td mat-cell *matCellDef="let element"> {{element.birthDate | date }} </td>
          </ng-container>

          <ng-container matColumnDef="telephone">
            <th mat-header-cell *matHeaderCellDef> Telefono </th>
            <td mat-cell *matCellDef="let element"> {{element.telephone}} </td>
          </ng-container>

          <ng-container matColumnDef="lastConsultant">
            <th mat-header-cell *matHeaderCellDef> Ultima Consulta </th>
            <td mat-cell *matCellDef="let element"> Hace 3 meses </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Acciones </th>
            <td mat-cell *matCellDef="let element">
              <a class="text-secondary underline hover:cursor-pointer">Ver Expediente</a>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons="false">
        </mat-paginator>
      </section>
    </div>
  </page-content>
</page-container>
