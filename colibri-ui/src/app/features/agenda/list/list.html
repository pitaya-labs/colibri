<page-container>
  <page-header>
    <div pageHeaderTitle>Agenda</div>
    <div pageHeaderActions>
      <button matButton="filled" routerLink="create">
        <div class="icon-with-text">
          <span class="material-symbols-outlined">calendar_add_on</span>
          <span>Nueva Cita</span>
        </div>
      </button>
    </div>
  </page-header>

  <page-content>

    <section class="flex justify-end items-center gap-3 flex-wrap bg-surface border border-surface-container-highest rounded-xl py-3 px-4 mb-4">
      <span class="material-symbols-outlined">filter_alt</span>
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="form-field-compact">
        <mat-label>Consultorio</mat-label>
        <mat-select>
          <mat-option>Consultorio 1</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-button-toggle-group name="fontStyle" class="button-toggle-compact">
        <mat-button-toggle value="bold">Todas</mat-button-toggle>
        <mat-button-toggle value="italic">Citas</mat-button-toggle>
        <mat-button-toggle value="underline">Consultas</mat-button-toggle>
      </mat-button-toggle-group>
      <div class="flex-1"></div>
      <button matButton>Limpiar Filtros</button>
    </section>

    <section class="bg-surface rounded-xl border border-surface-container-highest">
      <div class="flex flex-row justify-between items-center bg-surface-container-high rounded-t-xl px-4">
        <div class="font-(--font-weight-title)">
          <span>4 citas</span> - <span>4 consultas</span>
        </div>
        <div class="flex flex-row items-center gap-2 py-3">
          <mat-form-field appearance="outline" class="form-field-compact" subscriptSizing="dynamic">
            <span class="material-symbols-outlined" matIconPrefix>search</span>
            <input matInput placeholder="Buscar Paciente">
          </mat-form-field>
          <button matButton="outlined" class="button-secondary">
            <div class="icon-with-text">
              <span class="material-symbols-outlined">download</span>
              CSV
            </div>
          </button>
          <button matButton="outlined" class="button-secondary">
            <div class="icon-with-text">
              <span class="material-symbols-outlined">table_view</span>
              Excel
            </div>
          </button>
        </div>
      </div>

      <table mat-table [dataSource]="data">
        <ng-container matColumnDef="time">
          <th mat-header-cell *matHeaderCellDef> Hora </th>
          <td mat-cell *matCellDef="let element"> {{element.time | date: 'HH:mm - MMM, dd'}} </td>
        </ng-container>

        <ng-container matColumnDef="patient">
          <th mat-header-cell *matHeaderCellDef> Paciente </th>
          <td mat-cell *matCellDef="let element"> {{element.patient}} </td>
        </ng-container>

        <ng-container matColumnDef="reason">
          <th mat-header-cell *matHeaderCellDef> Motivo </th>
          <td mat-cell *matCellDef="let element"> {{element.reason}} </td>
        </ng-container>

        <ng-container matColumnDef="doctor">
          <th mat-header-cell *matHeaderCellDef> Medico </th>
          <td mat-cell *matCellDef="let element"> {{element.doctor}} </td>
        </ng-container>

        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef> Tipo </th>
          <td mat-cell *matCellDef="let element">
            <div class="w-fit border border-tertiary bg-tertiary-container text-on-tertiary-container rounded-lg p-0.5">
              Consulta
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="state">
          <th mat-header-cell *matHeaderCellDef> Estado </th>
          <td mat-cell *matCellDef="let element">
            <span class="text-tertiary font-normal before:content-['•'] before:text-tertiary before:font-semibold">
              {{element.state}}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Acciones </th>
          <td mat-cell *matCellDef="let element">
            <div class="flex flex-row gap-2">
              <span class="material-symbols-outlined icon-sm text-green-500 hover:cursor-pointer" matTooltip="Iniciar Consulta" routerLink="/consultation">start</span>
              <span class="material-symbols-outlined icon-sm text-blue-500 hover:cursor-pointer" routerLink="/consultation/detail">open_in_new</span>
              <span class="material-symbols-outlined icon-sm text-orange-400 hover:cursor-pointer">notes</span>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons="false">
      </mat-paginator>
    </section>
  </page-content>

</page-container>
